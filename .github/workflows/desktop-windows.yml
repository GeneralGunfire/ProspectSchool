name: Desktop (Windows)

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: npx @tauri-apps/cli icon src-tauri/icons/icon-master.png

      - name: Build Windows installer
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run desktop:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospect-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # CI artifacts (actions/upload-artifact above) require a signed-in
      # GitHub session to download — not a public link, which is why the
      # Downloads page button couldn't work off that alone. A GitHub
      # Release publishes the same .exe as a public asset with a real
      # direct-download URL anyone can use, tag-triggered runs only
      # (not workflow_dispatch, which has no tag to attach a release to).
      - name: Publish GitHub Release with installer
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
