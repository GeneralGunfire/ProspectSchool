name: Desktop (Windows)

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: npx @tauri-apps/cli icon src-tauri/icons/icon-master.png

      # Vite bakes empty strings into the bundle if a VITE_* secret is
      # unset rather than failing the build — a past run silently shipped
      # 3 broken installers this way (Supabase client threw at runtime
      # instead of at build time). Fail loudly here instead.
      - name: Verify required secrets are set
        shell: bash
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SITE_URL" ] && missing="$missing VITE_SITE_URL"
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "$VITE_SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing VITE_SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$VITE_GROQ_API_KEY" ] && missing="$missing VITE_GROQ_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — add them under Settings > Secrets and variables > Actions before building."
            exit 1
          fi
          echo "All required secrets are set."

      - name: Build Windows installer
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
        run: npm run desktop:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospect-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # CI artifacts (actions/upload-artifact above) require a signed-in
      # GitHub session to download — not a public link, which is why the
      # Downloads page button couldn't work off that alone. A GitHub
      # Release publishes the same .exe as a public asset with a real
      # direct-download URL anyone can use, tag-triggered runs only
      # (not workflow_dispatch, which has no tag to attach a release to).
      - name: Publish GitHub Release with installer
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
