name: Mobile (Android)

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        run: npm ci

      # Same failure mode as the desktop workflow: Vite bakes empty
      # strings into the bundle if a VITE_* secret is unset instead of
      # failing the build. Fail loudly here instead of shipping a broken APK.
      - name: Verify required secrets are set
        shell: bash
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SITE_URL" ] && missing="$missing VITE_SITE_URL"
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "$VITE_SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing VITE_SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$VITE_GROQ_API_KEY" ] && missing="$missing VITE_GROQ_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — add them under Settings > Secrets and variables > Actions before building."
            exit 1
          fi
          echo "All required secrets are set."

      - name: Build web assets
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospect-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Same reasoning as the desktop workflow: CI artifacts require a
      # signed-in GitHub session to download — not usable as a public
      # Downloads-page link. A GitHub Release publishes the APK as a
      # public asset instead, tag-triggered runs only.
      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
